[project]
name = "zeile"
version = "0.5.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 92
target-version = "py311"
# docs/ is prose: plans and READMEs quote illustrative snippets, and a
# formatter that rewrites them turns every documentation edit into churn.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The language-detection battery stores one realistic code sample per line;
# wrapping them into string concatenation would hurt readability for zero gain.
"tests/test_code_lang.py" = ["E501"]
