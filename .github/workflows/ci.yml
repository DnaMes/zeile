name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (GTK4 + WebKitGTK 6.0 GObject introspection)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-webkit-6.0 \
            shellcheck \
            python3-pip

      - name: Python dependencies
        run: |
          python3 -m pip install --break-system-packages \
            markdown nh3 pymdown-extensions pygments pytest ruff

      - name: ruff (lint)
        run: python3 -m ruff check .

      - name: ruff (format)
        run: python3 -m ruff format --check .

      - name: pytest
        run: python3 -m pytest -q

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

  distro:
    name: distro (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:base", "debian:13", "ubuntu:24.04", "fedora:43"]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies, tests, headless GUI, install round trip
        run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" /src/scripts/distro-check.sh
