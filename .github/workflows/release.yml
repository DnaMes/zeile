name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Validate and package Linux source release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-webkit-6.0 \
            gettext \
            shellcheck

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages \
            markdown nh3 pymdown-extensions pygments pytest ruff

      - name: Validate version copies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_version.py "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"

      - name: Run release checks
        run: |
          python3 -m ruff check .
          python3 -m pytest -q
          shellcheck install.sh
          msgfmt --check -o /dev/null po/de.po

      - name: Build source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="zeile-${version}/" \
            "$GITHUB_SHA" > "dist/zeile-${version}.tar.gz"
          sha256sum "dist/zeile-${version}.tar.gz" > dist/SHA256SUMS

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import re
          import sys

          tag = sys.argv[1]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
          if match is None:
              raise SystemExit(f"no CHANGELOG section found for {version}")
          Path("dist/RELEASE_NOTES.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/zeile-${version}.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "zeile ${version}" \
            --notes-file dist/RELEASE_NOTES.md
