name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Validate and package Linux source release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-webkit-6.0 \
            gettext \
            shellcheck

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages \
            markdown nh3 pymdown-extensions pygments pytest ruff

      - name: Validate version copies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_version.py "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"

      - name: Run release checks
        run: |
          python3 -m ruff check .
          python3 -m pytest -q
          shellcheck install.sh scripts/*.sh packaging/*.sh packaging/*/*.sh
          msgfmt --check -o /dev/null po/de.po

      - name: Build source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="zeile-${version}/" \
            "$GITHUB_SHA" > "dist/zeile-${version}.tar.gz"
          (cd dist && sha256sum "zeile-${version}.tar.gz" > SHA256SUMS)

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import re
          import sys

          tag = sys.argv[1]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
          if match is None:
              raise SystemExit(f"no CHANGELOG section found for {version}")
          Path("dist/RELEASE_NOTES.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/zeile-${version}.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "zeile ${version}" \
            --notes-file dist/RELEASE_NOTES.md

  packages:
    name: Build ${{ matrix.kind }} package
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: debian:13
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends git gettext
            build: packaging/debian/build-deb.sh
          - kind: rpm
            image: fedora:43
            setup: dnf install -y -q rpm-build git gettext
            build: packaging/rpm/build-rpm.sh
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: ${{ matrix.setup }}

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ matrix.build }}

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  attach-packages:
    name: Attach packages to the release
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: pkgs
          merge-multiple: true

      - name: Add them and their checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir pkgs
          # drop lines of an earlier run so a re-run does not duplicate them
          (cd pkgs && sed -i '/\.\(deb\|rpm\)$/d' SHA256SUMS && sha256sum *.deb *.rpm >> SHA256SUMS)
          gh release upload "$RELEASE_TAG" pkgs/*.deb pkgs/*.rpm pkgs/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
